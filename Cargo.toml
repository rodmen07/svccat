[package]
name = "svccat"
version = "1.6.0"
edition = "2021"
# MSRV: DECLARED as 1.85, and the committed lockfile does not build on it. The
# old note here said the floor was "driven by the heaviest dependency (clap 4
# requires 1.85)"; that is falsified by the lockfile. `url` pulls idna_adapter
# 1.2.2 and the icu_* 2.2.0 crates, and every one of those declares
# `rust-version = "1.86"` (read from each crate's own Cargo.toml in the registry
# cache, not from prose), so 1.86 was already the real floor with no
# dev-dependency involved. criterion 0.8 declares 1.86 as well, so the bump in
# [dev-dependencies] rides a floor that already existed rather than raising one.
# Nothing enforces any of this: no workflow pins a toolchain and there is no
# rust-toolchain.toml. Correcting the declared number is the MSRV-gate item in
# ROADMAP.md's v1.7.0 section, which lands the job and the number together.
rust-version = "1.85"
description = "Detect drift between your declared service catalog and what actually lives in the repo."
license = "MIT"
repository = "https://github.com/rodmen07/svccat"
homepage = "https://github.com/rodmen07/svccat"
documentation = "https://docs.rs/svccat"
keywords = ["microservices", "devops", "cli", "platform-engineering"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "svccat"
path = "src/lib.rs"

[[bin]]
name = "svccat"
path = "src/main.rs"

[dependencies]
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
clap_complete = "4"
colored     = "2"
glob        = "0.3"
notify      = "8"
regex       = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
# serde_yaml (dtolnay) is deprecated/unmaintained; serde_yaml_ng is the
# maintained drop-in fork. Renamed to `serde_yaml` so call sites are unchanged.
serde_yaml  = { package = "serde_yaml_ng", version = "0.10" }
toml        = "0.8"
ureq        = "2"
url         = "2"
rayon       = "1"

[dev-dependencies]
# Spawns the actual compiled `svccat` binary for binary-level integration
# tests (see tests/cli_binary_tests.rs), rather than calling internal render
# functions directly. `cargo_bin` resolves the freshly-built binary path
# regardless of OS or target triple, which is what makes it work unmodified
# across the CI matrix (ubuntu/windows/macos).
assert_cmd = "2"
# Test-only: `--format junit` hand-builds its XML with string concatenation
# (src/output/junit.rs), so its well-formedness is asserted by feeding the
# real output through a real parser and round-tripping escaped content back
# out, the same "verified as a property against a real consumer" shape the
# `url::Url::parse` check gave the SARIF URI fix. Not a runtime dependency:
# the shipped binary never parses XML, only emits it.
quick-xml = "0.41"
clap_complete = "4"
# Bench harness. `cargo bench -- --output-format bencher` is parsed by
# benchmark-action/github-action-benchmark in .github/workflows/benchmark.yml,
# so the version here is a CI contract and not only a dev convenience; the
# empirical claims that workflow's comments make about criterion's behaviour are
# tied to this version by tests/criterion_citation_tests.rs.
criterion = "0.8"
predicates = "3"
tempfile = "3"
# tests/fuzz_corpus_replay.rs replays the committed fuzz seed corpus through the
# same entry points the cargo-fuzz targets use. `glob` and `serde_yaml_ng` are
# already normal dependencies (above); they are re-declared here, pinned
# identically, only so the replay helpers can mirror the fuzz targets verbatim
# (a normal dependency is not in scope for an integration test's crate root).
glob        = "0.3"
serde_yaml  = { package = "serde_yaml_ng", version = "0.10" }

[[bench]]
name = "benchmark"
harness = false

[[bench]]
name = "large_manifest_benchmark"
harness = false
