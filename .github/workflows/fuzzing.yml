name: Continuous Fuzzing

on:
  push:
    branches: [ main ]
  schedule:
    # Run once every 24 hours automatically to verify against regression
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest

    # One real cargo-fuzz target per job, run for real. This workflow does
    # NOT run on pull_request (fuzzing is a push/schedule/manual concern, not
    # a per-PR gate — see ci.yml's build-and-test job and svccat-pr.yml for
    # what actually gates a PR), so a multi-minute budget per target here
    # does not slow down anyone's merge.
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with fuzz/Cargo.toml's [[bin]] entries, the files in
        # fuzz/fuzz_targets/, and the seed corpora in fuzz/corpus_seeds/. A
        # target missing from THIS list still builds and still has tests, but is
        # never actually fuzzed — the inert-surface failure this workflow was
        # itself guilty of before PR #15. `fuzz_targets_agree_across_sources` in
        # tests/fuzz_corpus_replay.rs fails the PR gate if they drift apart.
        target: [fuzz_manifest, fuzz_url, fuzz_glob, fuzz_policy]

    steps:
      # 1. Pull project specifications
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. cargo-fuzz's libFuzzer instrumentation requires the nightly compiler.
      - name: Install Nightly Rust Toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2.7.3
        with:
          workspaces: |
            . -> target
            fuzz -> fuzz/target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # 3. Carry the WORKING corpus over from the previous run of this target.
      #
      # `fuzz/corpus/<target>` is gitignored scratch space: libFuzzer writes
      # every newly discovered coverage-increasing input there, and before this
      # cache the runner threw all of it away when the job ended. Every daily
      # campaign therefore re-explored the same ground from the same starting
      # point — the scheduled runs on 2026-07-25 and 2026-07-31 report the
      # IDENTICAL `INITED cov:` figures (fuzz_manifest 3496, fuzz_policy 1246,
      # fuzz_url 654, fuzz_glob 128), i.e. a week of 121-second campaigns
      # produced exactly zero cumulative progress.
      #
      # The key is unique per run so every job SAVES a fresh entry (a save onto
      # an existing key is a no-op, which would freeze the corpus at its first
      # snapshot); `restore-keys` then matches the newest previous entry for the
      # same target. The committed seeds under `fuzz/corpus_seeds/<target>` are
      # NOT cached and are never written to — they stay the reproducible floor
      # that `tests/fuzz_corpus_replay.rs` pins, so a poisoned or evicted cache
      # degrades a run back to exactly today's behaviour and never below it.
      - name: Restore the working fuzz corpus (${{ matrix.target }})
        uses: actions/cache/restore@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      # 4. Actually build and run the named fuzz target against THIS
      # checkout's code (fuzz/Cargo.toml depends on svccat via `path = ".."`,
      # so this always fuzzes the code in the PR/commit being tested, never
      # a published crates.io release).
      #
      # Corpus arguments, and why the ORDER matters: libFuzzer treats the
      # FIRST corpus directory as the writable one (new interesting inputs
      # are written there) and every later directory as read-only seed
      # input. So the gitignored working corpus `fuzz/corpus/<target>` goes
      # first and the COMMITTED `fuzz/corpus_seeds/<target>` seeds go
      # second, which means a run can never mutate the committed corpus that
      # `tests/fuzz_corpus_replay.rs` pins.
      #
      # Without the seed argument every job started from nothing — the run
      # on main before this change reported `INITED ... corp: 1/1b` for all
      # four targets, i.e. one synthetic empty input — so the committed
      # regression seeds (including the PR #16 base-cycle crash
      # reproducers) were replayed only by the PR-time test suite and were
      # never actually handed to the fuzzer. `fuzzing_workflow_runs_from_the_committed_seed_corpus`
      # in tests/fuzz_corpus_replay.rs fails the PR gate if this regresses.
      #
      # Budget: 120 seconds of libFuzzer time per target. This is a CI-sane
      # bound for a background/regression job, not a serious continuous
      # fuzzing campaign — it is enough to catch cheap, shallow crashes
      # (e.g. an unguarded recursive `base` chain in the policy rule
      # compiler) on every push to main and once a day, without turning this
      # job into a multi-hour runner. Extending the budget is a follow-up; the
      # working corpus now carries over (step 3), so successive runs compound
      # instead of restarting.
      #
      # The `carried-in corpus` line is the direct, libFuzzer-independent
      # readout of whether the restore actually landed: 0 files means a cache
      # miss and a run that starts from the committed seeds alone.
      - name: Run cargo fuzz (${{ matrix.target }})
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          echo "carried-in corpus: $(find fuzz/corpus/${{ matrix.target }} -type f | wc -l) file(s)"
          cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} \
            fuzz/corpus_seeds/${{ matrix.target }} \
            -- -max_total_time=120

      # 5. Persist whatever this campaign discovered, so the next run starts
      # where this one stopped. `always()` so a crashing run still banks the
      # inputs that led to it.
      - name: Save the working fuzz corpus (${{ matrix.target }})
        if: always()
        uses: actions/cache/save@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # 6. Preserve the crashing input so it can be downloaded and
      # reproduced locally with `cargo fuzz run <target> <artifact>`.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
