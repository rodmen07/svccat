name: Performance Benchmarks

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    name: Benchmark & Track Performance
    runs-on: ubuntu-latest

    # github-action-benchmark pushes tracking data to the gh-pages branch
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2.9.2

      - name: Run benchmarks
        # target/criterion is wiped FIRST, and that is the fix rather than the
        # hygiene it looks like. Criterion's default baseline directory is
        # `base`; when that directory exists but its sample.json does not -- the
        # state a partially restored target/ cache leaves behind -- criterion
        # emits `Criterion.rs ERROR: error: Failed to access file
        # ".../base/sample.json"` through println!, i.e. onto STDOUT, straight
        # into the middle of `test <name> ... ` and before `bench: <n> ns/iter`.
        # That splits the one line github-action-benchmark's cargo extractor
        # matches, so the run parses ZERO benchmarks. Reproduced locally on
        # criterion 0.8.2 in all three states: no criterion dir at all -> one
        # clean `test load_manifest_small ... bench: 26035 ns/iter (+/- 5012)`;
        # complete baseline -> the same clean shape; base/ present with
        # sample.json deleted -> the split line, byte-identical to the CI
        # failure on 9ee581b. The bench process EXITS 0 in all three, which is
        # why nothing upstream noticed. A virgin directory is the state proven
        # clean, and nothing is lost by forcing it: the tracking history this
        # workflow publishes lives on the gh-pages branch, not under target/.
        run: |
          rm -rf target/criterion
          cargo bench --bench benchmark -- --output-format bencher | tee output.txt

      - name: Check binary size
        run: |
          cargo build --release
          SIZE=$(stat -f%z target/release/svccat 2>/dev/null || stat -c%s target/release/svccat)
          echo "Binary size: $((SIZE / 1024 / 1024)) MB"

      # THE STEP BELOW IS WHY main COULD GO RED WITH EVERY PR GREEN. Storing was
      # gated on `refs/heads/main`, so the only step that PARSES output.txt was
      # structurally unreachable from a pull request: PR #46's own benchmark run
      # was green and could not have been anything else, and the identical tree
      # failed the moment it became main. This step is that same action, with
      # the same `tool: cargo` extractor, run on everything that is not main and
      # publishing nothing -- so a run whose output.txt cannot be parsed now
      # fails on the pull request that introduces it. It is deliberately the
      # ACTION and not a hand-written grep: a second parser would be a second
      # definition of "parseable" and would drift from the one that gates main.
      - name: Verify benchmark output parses (no publish)
        if: github.ref != 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          # external-data-json-path is what keeps this step off the gh-pages
          # branch entirely, and it replaced `skip-fetch-gh-pages: true`, which
          # did NOT: that input skips only the FETCH, after which the action
          # still runs `git switch gh-pages` and dies with `fatal: invalid
          # reference: gh-pages`, because a PR checkout has no local gh-pages.
          # Observed on this PR's first run (job 93871437572) -- i.e. this step
          # caught its own misconfiguration before merge, which is exactly the
          # thing the old workflow could not do for anything.
          external-data-json-path: benchmark-parse-check.json
          auto-push: false
          save-data-file: false
          comment-on-alert: false
          fail-on-alert: false

      - name: Store benchmark results
        if: github.ref == 'refs/heads/main'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'cargo'
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Parse benchmark results
            let comment = '## 📊 Performance Benchmarks\n\n';
            comment += 'Benchmarks completed successfully.\n\n';
            comment += 'Run locally with: `cargo bench`\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment,
            });
