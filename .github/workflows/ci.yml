name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Workflow-level least-privilege GITHUB_TOKEN default: `test-and-verify` and
# `build-and-test` carried no `permissions:` of their own, so they inherited
# the repo-level default, which is a settings-page toggle rather than a
# reviewed commit. The `audit` and `lint` jobs keep their identical job-level
# blocks (a job-level block replaces this one entirely for that job).
# tests/workflow_permissions_tests.rs guards this block's presence.
permissions:
  contents: read

jobs:
  test-and-verify:
    name: Verify Registry Deployment
    # This loops through 3 OS platforms × 3 Rust toolchains = 9 independent runners
    strategy:
      fail-fast: false # Ensures one failing job doesn't cancel the other 8 downloads
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta, nightly]

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Bring down the repo code to let the runner know what to execute
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # 2. Dynamically provision the specific matrix toolchain channel
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      # 3. FORCE NETWORK HIT FROM CRATES.IO
      # This completely bypasses any local targets and pulls directly from the public registry.
      # Using --force ensures the runner downloads the crate assets on every single run.
      - name: Install Latest Release From Registry
        run: cargo install svccat --force --no-track

      # 4. Optional: Run your verification test suite against the installed binary
      - name: Verify CLI Execution
        run: svccat --version

  build-and-test:
    name: Build & Test (This Checkout)
    # Distinct from "Verify Registry Deployment" above. That job answers "does
    # the already-published crates.io release still install and run on this
    # OS/toolchain?" — a valid smoke test, left unchanged. This job answers a
    # different question: "does THIS PR's own code compile and pass its tests?"
    # which the registry job structurally cannot, since `cargo install
    # svccat` always fetches the published release, never this checkout.
    #
    # Scope: one runner per OS on stable only (not the full 3x3 matrix above).
    # `coverage.yml` already builds and tests this checkout on ubuntu/nightly,
    # so stable-per-OS here adds the two OSes with zero real-code coverage
    # today (windows, macos) plus an ubuntu/stable leg, without doubling this
    # job count to a second 9-way matrix. beta/nightly stay exclusively on the
    # registry smoke test above; if that channel coverage is ever wanted for
    # this checkout too, that is a follow-up, not folded in here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2.9.2

      # Full build, not just `cargo check`: this repo's real defects to date
      # (PR #6/#7 XSS, PR #8 silent stdout regression) were caught by tests,
      # not by the compiler, so `cargo test` is the tier that actually gates.
      - name: Build this checkout (all features)
        run: cargo build --all-features --verbose

      - name: Test this checkout (all features)
        run: cargo test --all-features --verbose

  audit:
    name: Security audit
    # svccat is published to crates.io, so a vulnerable transitive dependency
    # is a supply-chain concern for downstream users. This job scans the
    # committed Cargo.lock — the exact pinned versions that ship — on every PR.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run security audit
        # --deny warnings promotes unsound/unmaintained/yanked advisories to
        # failures instead of letting them accumulate silently (cargo audit
        # exits 0 on those by default). Clean at time of adding (213 deps, no
        # findings); the gate exists so a future advisory fails CI rather than
        # riding along invisibly.
        run: cargo audit --deny warnings

  lint:
    name: Lint (fmt + clippy)
    # Until this job existed, NO workflow in this repo ran rustfmt or clippy
    # at all (all six workflow files used only build/test/audit/bench/fuzz
    # steps), so formatting drift and clippy errors could merge silently:
    # svccat PR #24's first draft carried two (`field_reassign_with_default`,
    # `type_complexity`) that only a local run caught. slokit already requires
    # a `fmt, clippy, test` context, so svccat was the outlier of the three
    # published crates.
    #
    # Scope: ubuntu-latest only. "Build & Test (This Checkout)" above already
    # covers all three OSes for compile and test; rustfmt's output and the
    # clippy lint set are toolchain-versioned rather than OS-versioned, so a
    # second and third runner would re-report identical findings. Kept as its
    # own job rather than two extra steps in the build matrix so a lint
    # failure is a distinct, greppable red instead of one buried inside a leg
    # that also compiles and tests.
    #
    # The job NAME is load-bearing: it is the exact branch-protection required
    # context string on `main`. `tests/ci_lint_gate_tests.rs` pins both the
    # name and the two commands so neither can drift out from under it.
    #
    # Floating `@stable` (this repo-wide convention) means a new clippy
    # release can red a PR whose own diff did not cause it. That is
    # toolchain drift, and the response is to clear the new lint, never to
    # weaken this gate. It happened on this job first run: clippy 1.97 on
    # the runner flagged `question_mark` in `src/rule_schema.rs` while the
    # local clippy 1.96 was silent about it.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2.9.2

      - name: Check formatting
        run: cargo fmt --all -- --check

      # --all-targets lints tests, benches and examples too, not just the lib
      # and binary; -- -D warnings makes a lint a failure instead of a line of
      # green-run noise nobody reads.
      - name: Clippy (all targets, all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

  msrv:
    name: MSRV 1.86
    # Proves the declared `rust-version` in Cargo.toml actually builds this
    # checkout: every target, every feature, against the committed lockfile.
    # Until this job existed nothing enforced the floor and the declared value
    # was fiction: Cargo.toml said 1.85 while the committed lockfile carried
    # idna_adapter 1.2.2 and the icu_* 2.2.0 crates (via `url`) plus criterion
    # 0.8.2, every one declaring `rust-version = "1.86"`, so
    # `cargo +1.85 check --locked` exited 101 on exactly that disagreement.
    # The job and the declared number shipped together, and
    # `tests/msrv_gate_tests.rs` couples them both ways: the `toolchain:`
    # installed here, the version in this job's `name:` (the branch-protection
    # required-context string, like the lint job's), and Cargo.toml's
    # `rust-version` must all agree, so none of the three can drift alone.
    #
    # When this job goes red after a dependency bump, the new version raised
    # its own floor. Two legal fixes, never a third: pin the dependency back
    # (`cargo update <name>@<new-ver> --precise <compatible-ver>`, the recipe
    # cargo's own error message prints), or raise the floor deliberately —
    # `rust-version`, this job's `toolchain:` and this job's `name:` in the
    # same PR, plus the matching required-context rename on `main`'s branch
    # protection. Never "fix" it by dropping `--locked`: an unlocked resolve
    # floats the lockfile past the disagreement instead of reporting it.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Install Rust Toolchain (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"

      - name: Cache Cargo registry and build output
        uses: Swatinem/rust-cache@v2.9.2

      # --all-targets reaches the dev-dependency floor too (criterion 0.8
      # declares 1.86); --locked makes a lockfile the MSRV cannot build a
      # loud failure instead of a silent re-resolve.
      - name: Check every target on the minimum supported Rust
        run: cargo check --all-targets --all-features --locked
